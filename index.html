<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marks Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,800;1,9..144,300;1,9..144,600&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #050810;
  --glass-1: rgba(255,255,255,0.032);
  --glass-2: rgba(255,255,255,0.055);
  --glass-3: rgba(255,255,255,0.08);
  --border-1: rgba(255,255,255,0.07);
  --border-2: rgba(255,255,255,0.13);
  --border-3: rgba(255,255,255,0.20);
  --text: #f0f0fa;
  --muted: rgba(240,240,250,0.48);
  --dim: rgba(240,240,250,0.22);
  --radius-card: 22px;
  --radius-sm: 12px;

  /* Subject palette — carefully chosen, not rainbow */
  --bio:  #3ecfcf;  --bio-g:  rgba(62,207,207,0.18);  --bio-soft: rgba(62,207,207,0.08);
  --app:  #f0a045;  --app-g:  rgba(240,160,69,0.18);   --app-soft: rgba(240,160,69,0.08);
  --psy:  #d47bff;  --psy-g:  rgba(212,123,255,0.18);  --psy-soft: rgba(212,123,255,0.08);
  --eng:  #6b9fff;  --eng-g:  rgba(107,159,255,0.18);  --eng-soft: rgba(107,159,255,0.08);
  --lit:  #5ce6a0;  --lit-g:  rgba(92,230,160,0.18);   --lit-soft: rgba(92,230,160,0.08);
  --hlt:  #ff8a80;  --hlt-g:  rgba(255,138,128,0.18);  --hlt-soft: rgba(255,138,128,0.08);
}

html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Background ── */
.bg-layer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  overflow: hidden;
}
.bg-mesh {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 5%  10%,  rgba(62,207,207,0.12)  0%, transparent 55%),
    radial-gradient(ellipse 50% 45% at 95% 85%,  rgba(212,123,255,0.14) 0%, transparent 55%),
    radial-gradient(ellipse 40% 40% at 80% 15%,  rgba(107,159,255,0.10) 0%, transparent 50%),
    radial-gradient(ellipse 35% 35% at 20% 80%,  rgba(92,230,160,0.09)  0%, transparent 50%),
    radial-gradient(ellipse 55% 60% at 50% 50%,  rgba(5,8,20,0.7)       0%, transparent 70%);
}
.bg-grain {
  position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 200px 200px;
  opacity: 0.5;
}

/* ── Layout ── */
.app {
  position: relative; z-index: 1;
  max-width: 1080px;
  margin: 0 auto;
  padding: 3rem 1.5rem 7rem;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 2.75rem;
  flex-wrap: wrap;
  gap: 1.5rem;
}
.header-left { display: flex; flex-direction: column; gap: 0.35rem; }
.kicker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dim);
  display: flex; align-items: center; gap: 8px;
}
.kicker-line { width: 20px; height: 1px; background: var(--dim); }
h1 {
  font-family: 'Fraunces', serif;
  font-size: clamp(2.4rem, 5.5vw, 3.8rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--text);
}
h1 span {
  font-style: italic;
  font-weight: 300;
  color: var(--muted);
}

/* Overview strip */
.overview {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border-1);
  border: 1px solid var(--border-1);
  border-radius: 18px;
  overflow: hidden;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  margin-bottom: 2rem;
}
.ov-cell {
  background: var(--glass-1);
  padding: 1.25rem 1.4rem;
}
.ov-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 0.4rem;
}
.ov-val {
  font-family: 'Fraunces', serif;
  font-size: 1.9rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
.ov-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--dim);
  margin-top: 0.3rem;
}

/* ── Subject tabs ── */
.tab-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.tab-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 7px 16px;
  border-radius: 100px;
  border: 1px solid var(--border-1);
  background: var(--glass-1);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}
.tab-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--tab-accent-soft, transparent);
  opacity: 0;
  transition: opacity 0.18s;
}
.tab-btn:hover { border-color: var(--border-2); color: var(--text); }
.tab-btn:hover::before { opacity: 1; }
.tab-btn.active {
  border-color: var(--tab-accent);
  color: var(--tab-accent);
  box-shadow: 0 0 18px var(--tab-accent-g, transparent);
}
.tab-btn.active::before { opacity: 1; }

/* ── Subject panel ── */
.subject-panel { display: none; }
.subject-panel.active {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  gap: 1.125rem;
  animation: panelIn 0.35s cubic-bezier(0.2,0,0,1) both;
}
@keyframes panelIn {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}

/* ── Glass card base ── */
.gcard {
  background: var(--glass-1);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-card);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  padding: 1.75rem;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.gcard::after {
  content: '';
  position: absolute;
  top: 0; left: 30px; right: 30px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-border, rgba(255,255,255,0.12)), transparent);
}
.gcard:hover { border-color: var(--border-2); }

.card-glow {
  position: absolute;
  top: -80px; right: -80px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: var(--glow-col, rgba(255,255,255,0.03));
  filter: blur(60px);
  pointer-events: none;
  transition: opacity 0.3s;
}

.card-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 1.1rem;
  display: flex; align-items: center; gap: 8px;
}
.card-label-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

/* ── Stats card ── */
.stats-card { grid-column: 1; grid-row: 1; }
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}
.stat-box {
  background: var(--glass-2);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-sm);
  padding: 1rem 1.1rem;
}
.stat-box-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 0.35rem;
}
.stat-box-val {
  font-family: 'Fraunces', serif;
  font-size: 1.6rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
.stat-box-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--dim);
  margin-top: 0.2rem;
}

/* Target row */
.target-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 1rem;
  background: var(--glass-2);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-sm);
  padding: 0.875rem 1rem;
}
.target-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--dim);
  flex-shrink: 0;
}
input[type="number"] {
  width: 70px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border-2);
  border-radius: 8px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 5px 8px;
  outline: none;
  transition: border-color 0.15s;
  text-align: center;
}
input[type="number"]:focus { border-color: var(--accent, rgba(255,255,255,0.3)); }
.gap-pill {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 100px;
  border: 1px solid;
  white-space: nowrap;
}
.gap-positive { color: #5ce6a0; border-color: rgba(92,230,160,0.35); background: rgba(92,230,160,0.08); }
.gap-negative { color: #ff8a80; border-color: rgba(255,138,128,0.35); background: rgba(255,138,128,0.08); }
.gap-neutral  { color: var(--dim); border-color: var(--border-1); background: transparent; }

/* ── Chart card ── */
.chart-card { grid-column: 2; grid-row: 1 / 3; }
.chart-wrap {
  position: relative;
  height: 280px;
}

/* ── Log card ── */
.log-card { grid-column: 1; grid-row: 2; }

.log-form {
  display: grid;
  grid-template-columns: 1fr 80px 90px auto;
  gap: 8px;
  margin-bottom: 1.1rem;
}
.log-form input, .log-form select {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border-1);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  padding: 8px 10px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
  min-width: 0;
}
.log-form input::placeholder { color: var(--dim); }
.log-form input:focus,
.log-form select:focus { border-color: var(--accent, rgba(255,255,255,0.3)); }
.log-form select option { background: #101225; }

.btn-add {
  background: var(--accent-soft, rgba(255,255,255,0.06));
  border: 1px solid var(--accent-border-btn, var(--border-2));
  border-radius: 10px;
  color: var(--accent, var(--text));
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 14px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn-add:hover { background: var(--accent-soft-hover, rgba(255,255,255,0.10)); border-color: var(--accent, var(--border-3)); }

/* Log entries */
.log-entries { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
.log-entries::-webkit-scrollbar { width: 3px; }
.log-entries::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

.log-entry {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--glass-2);
  border: 1px solid var(--border-1);
  border-radius: 10px;
  padding: 0.6rem 0.875rem;
  animation: entryIn 0.25s ease both;
}
@keyframes entryIn { from{opacity:0;transform:translateX(-8px);} to{opacity:1;transform:translateX(0);} }

.entry-score {
  font-family: 'Fraunces', serif;
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  min-width: 44px;
}
.entry-name {
  font-size: 13px;
  color: var(--muted);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.entry-type {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
  background: var(--glass-3);
  padding: 2px 7px;
  border-radius: 4px;
}
.entry-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--dim);
}
.entry-del {
  background: none;
  border: none;
  color: var(--dim);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color 0.15s;
  flex-shrink: 0;
}
.entry-del:hover { color: #ff8a80; }
.entry-weight {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--dim);
  flex-shrink: 0;
}

.empty-log {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem;
  gap: 0.5rem;
  color: var(--dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  text-align: center;
  letter-spacing: 0.06em;
}
.empty-icon { font-size: 24px; opacity: 0.4; }

/* ── Weighted average card (full width below) ── */
.weighted-section { margin-top: 1.5rem; }
.weighted-card {
  background: var(--glass-1);
  border: 1px solid var(--border-1);
  border-radius: var(--radius-card);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  padding: 1.75rem 2rem;
  position: relative;
  overflow: hidden;
}
.weighted-card::after {
  content: '';
  position: absolute;
  top: 0; left: 40px; right: 40px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}
.weighted-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 1px;
  background: var(--border-1);
  border-radius: 14px;
  overflow: hidden;
  margin-top: 1.25rem;
}
.wg-cell {
  background: var(--glass-1);
  padding: 1.1rem 1rem;
  text-align: center;
  transition: background 0.15s;
}
.wg-cell:hover { background: var(--glass-2); }
.wg-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin: 0 auto 0.5rem;
}
.wg-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 0.4rem;
}
.wg-score {
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1;
}
.wg-entries {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--dim);
  margin-top: 0.25rem;
}

/* ── Trend indicator ── */
.trend-up   { color: #5ce6a0; }
.trend-down { color: #ff8a80; }
.trend-flat { color: var(--dim); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

@media(max-width: 720px) {
  .subject-panel.active { grid-template-columns: 1fr; }
  .chart-card { grid-column: 1; grid-row: auto; }
  .log-card   { grid-column: 1; grid-row: auto; }
  .overview { grid-template-columns: 1fr 1fr; }
  .weighted-grid { grid-template-columns: repeat(3,1fr); }
  .log-form { grid-template-columns: 1fr 70px; grid-template-rows: auto auto; }
}
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-mesh"></div>
  <div class="bg-grain"></div>
</div>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="kicker"><span class="kicker-line"></span>WACE 2025 · Perth WA</div>
      <h1>Marks <span>& Progress</span></h1>
    </div>
  </header>

  <!-- Overview strip -->
  <div class="overview">
    <div class="ov-cell">
      <div class="ov-label">Total entries</div>
      <div class="ov-val" id="ov-total">0</div>
      <div class="ov-sub">across all subjects</div>
    </div>
    <div class="ov-cell">
      <div class="ov-label">Overall average</div>
      <div class="ov-val" id="ov-avg">—</div>
      <div class="ov-sub">weighted mean</div>
    </div>
    <div class="ov-cell">
      <div class="ov-label">Best subject</div>
      <div class="ov-val" id="ov-best" style="font-size:1.1rem;padding-top:5px;">—</div>
      <div class="ov-sub" id="ov-best-sub">no data yet</div>
    </div>
    <div class="ov-cell">
      <div class="ov-label">Needs attention</div>
      <div class="ov-val" id="ov-worst" style="font-size:1.1rem;padding-top:5px;">—</div>
      <div class="ov-sub" id="ov-worst-sub">no data yet</div>
    </div>
  </div>

  <!-- Subject tabs -->
  <div class="tab-row" id="tab-row"></div>

  <!-- Subject panels -->
  <div id="panels"></div>

  <!-- Weighted averages section -->
  <div class="weighted-section">
    <div class="weighted-card">
      <div class="card-label"><span class="card-label-dot" style="background:rgba(255,255,255,0.4);box-shadow:none;"></span>Weighted averages — all subjects</div>
      <div class="weighted-grid" id="weighted-grid"></div>
    </div>
  </div>

</div>

<script>
const SUBJECTS = [
  { key:'bio', name:'Human Biology', short:'HumBio',  accent:'#3ecfcf', glow:'rgba(62,207,207,0.15)',  soft:'rgba(62,207,207,0.07)',  border:'rgba(62,207,207,0.30)' },
  { key:'app', name:'Applications',  short:'AppsMath',accent:'#f0a045', glow:'rgba(240,160,69,0.15)',   soft:'rgba(240,160,69,0.07)',   border:'rgba(240,160,69,0.30)' },
  { key:'psy', name:'Psychology',    short:'Psych',   accent:'#d47bff', glow:'rgba(212,123,255,0.15)',  soft:'rgba(212,123,255,0.07)',  border:'rgba(212,123,255,0.30)' },
  { key:'eng', name:'English',       short:'English', accent:'#6b9fff', glow:'rgba(107,159,255,0.15)',  soft:'rgba(107,159,255,0.07)',  border:'rgba(107,159,255,0.30)' },
  { key:'lit', name:'Literature',    short:'Lit',     accent:'#5ce6a0', glow:'rgba(92,230,160,0.15)',   soft:'rgba(92,230,160,0.07)',   border:'rgba(92,230,160,0.30)' },
  { key:'hlt', name:'Health Studies',short:'Health',  accent:'#ff8a80', glow:'rgba(255,138,128,0.15)',  soft:'rgba(255,138,128,0.07)',  border:'rgba(255,138,128,0.30)' },
];

const TYPES = ['Exam','Test','Assignment','Essay','Oral','Other'];
const TYPE_WEIGHTS = { Exam:1.5, Test:1.2, Assignment:1.0, Essay:1.1, Oral:1.0, Other:0.8 };

// State
let data = {};
let targets = {};
let charts = {};
let activeTab = SUBJECTS[0].key;

function loadData() {
  try {
    const d = localStorage.getItem('wace_marks_v2');
    if (d) { const p = JSON.parse(d); data = p.data||{}; targets = p.targets||{}; }
  } catch(e) {}
  SUBJECTS.forEach(s => { if(!data[s.key]) data[s.key]=[]; if(!targets[s.key]) targets[s.key]=80; });
}

function saveData() {
  try { localStorage.setItem('wace_marks_v2', JSON.stringify({data,targets})); } catch(e){}
}

function weightedAvg(entries) {
  if (!entries.length) return null;
  let wsum = 0, wtotal = 0;
  entries.forEach(e => { const w = TYPE_WEIGHTS[e.type]||1; wsum += e.score * w; wtotal += w; });
  return Math.round((wsum/wtotal)*10)/10;
}

function simpleAvg(entries) {
  if (!entries.length) return null;
  return Math.round((entries.reduce((s,e)=>s+e.score,0)/entries.length)*10)/10;
}

function trend(entries) {
  if (entries.length < 2) return null;
  const last = entries.slice(-3);
  const prev = entries.slice(-6,-3);
  if (!prev.length) return simpleAvg(last) - entries[0].score;
  return simpleAvg(last) - simpleAvg(prev);
}

// ── Build UI ──
function buildTabs() {
  const row = document.getElementById('tab-row');
  row.innerHTML = SUBJECTS.map(s => `
    <button class="tab-btn ${s.key===activeTab?'active':''}" id="tab-${s.key}"
      style="--tab-accent:${s.accent};--tab-accent-g:${s.glow};--tab-accent-soft:${s.soft};"
      onclick="switchTab('${s.key}')">${s.name}</button>
  `).join('');
}

function buildPanels() {
  const container = document.getElementById('panels');
  container.innerHTML = SUBJECTS.map(s => `
    <div class="subject-panel ${s.key===activeTab?'active':''}" id="panel-${s.key}"
         style="--accent:${s.accent};--glow-col:${s.glow};--accent-soft:${s.soft};--accent-border:${s.border};--accent-border-btn:${s.border};--accent-soft-hover:${s.glow};">

      <!-- Stats card -->
      <div class="gcard stats-card">
        <div class="card-glow"></div>
        <div class="card-label"><span class="card-label-dot"></span>Performance</div>
        <div class="stat-grid">
          <div class="stat-box">
            <div class="stat-box-label">Weighted avg</div>
            <div class="stat-box-val" id="${s.key}-wavg" style="color:${s.accent}">—</div>
            <div class="stat-box-sub">by assessment type</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Simple avg</div>
            <div class="stat-box-val" id="${s.key}-savg">—</div>
            <div class="stat-box-sub">raw mean</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Highest</div>
            <div class="stat-box-val" id="${s.key}-high">—</div>
            <div class="stat-box-sub" id="${s.key}-high-name">–</div>
          </div>
          <div class="stat-box">
            <div class="stat-box-label">Trend</div>
            <div class="stat-box-val" id="${s.key}-trend">—</div>
            <div class="stat-box-sub" id="${s.key}-trend-sub">last 3 vs prior 3</div>
          </div>
        </div>
        <div class="target-row">
          <span class="target-label">Target</span>
          <input type="number" min="0" max="100" value="${targets[s.key]||80}"
                 oninput="setTarget('${s.key}',this.value)" style="border-color:${s.border};">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);">%</span>
          <div class="gap-pill" id="${s.key}-gap">—</div>
        </div>
      </div>

      <!-- Chart card -->
      <div class="gcard chart-card">
        <div class="card-glow"></div>
        <div class="card-label"><span class="card-label-dot"></span>Score trajectory</div>
        <div class="chart-wrap"><canvas id="chart-${s.key}"></canvas></div>
      </div>

      <!-- Log card -->
      <div class="gcard log-card">
        <div class="card-glow"></div>
        <div class="card-label"><span class="card-label-dot"></span>Log entry</div>
        <div class="log-form">
          <input type="text" id="in-name-${s.key}" placeholder="Assessment name…" maxlength="40">
          <input type="number" id="in-score-${s.key}" placeholder="Score" min="0" max="100">
          <select id="in-type-${s.key}">
            ${TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}
          </select>
          <button class="btn-add" onclick="addEntry('${s.key}')">+ Add</button>
        </div>
        <div class="log-entries" id="log-${s.key}"></div>
      </div>

    </div>
  `).join('');
}

function switchTab(key) {
  activeTab = key;
  document.querySelectorAll('.subject-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`panel-${key}`).classList.add('active');
  document.getElementById(`tab-${key}`).classList.add('active');
  initChart(key);
  refreshSubject(key);
}

// ── Chart ──
function initChart(key) {
  if (charts[key]) { charts[key].destroy(); delete charts[key]; }
  const sub = SUBJECTS.find(s=>s.key===key);
  const ctx = document.getElementById(`chart-${key}`).getContext('2d');
  const entries = data[key] || [];
  const labels = entries.map((_,i)=>i===0?'Start':`#${i+1}`);
  const scores = entries.map(e=>e.score);
  const target = targets[key] || 80;

  const grad = ctx.createLinearGradient(0, 0, 0, 280);
  grad.addColorStop(0, sub.accent + '30');
  grad.addColorStop(1, sub.accent + '00');

  charts[key] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels.length ? labels : [''],
      datasets: [
        {
          label: 'Score',
          data: scores,
          borderColor: sub.accent,
          backgroundColor: grad,
          borderWidth: 2,
          pointBackgroundColor: sub.accent,
          pointBorderColor: '#050810',
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          tension: 0.45,
        },
        {
          label: 'Target',
          data: labels.length ? labels.map(()=>target) : [target],
          borderColor: 'rgba(255,255,255,0.18)',
          borderWidth: 1.5,
          borderDash: [5,4],
          pointRadius: 0,
          fill: false,
          tension: 0,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(10,12,28,0.92)',
          borderColor: 'rgba(255,255,255,0.12)',
          borderWidth: 1,
          titleColor: sub.accent,
          bodyColor: 'rgba(240,240,250,0.7)',
          padding: 10,
          callbacks: {
            title: (items) => {
              const i = items[0].dataIndex;
              return entries[i]?.name || `Entry ${i+1}`;
            },
            label: (item) => {
              if (item.datasetIndex===0) return ` Score: ${item.raw}%`;
              return ` Target: ${item.raw}%`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.04)', drawBorder: false },
          ticks: { color: 'rgba(240,240,250,0.25)', font: { family:'JetBrains Mono', size:10 } }
        },
        y: {
          min: 0, max: 100,
          grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false },
          ticks: {
            color: 'rgba(240,240,250,0.25)',
            font: { family:'JetBrains Mono', size:10 },
            callback: v => v+'%',
            stepSize: 20
          }
        }
      }
    }
  });
}

// ── Refresh subject stats ──
function refreshSubject(key) {
  const entries = data[key] || [];
  const sub = SUBJECTS.find(s=>s.key===key);
  const wa = weightedAvg(entries);
  const sa = simpleAvg(entries);
  const target = targets[key] || 80;

  // Stat boxes
  document.getElementById(`${key}-wavg`).textContent = wa!==null ? wa+'%' : '—';
  document.getElementById(`${key}-savg`).textContent = sa!==null ? sa+'%' : '—';

  if (entries.length) {
    const hi = entries.reduce((m,e)=>e.score>m.score?e:m, entries[0]);
    document.getElementById(`${key}-high`).textContent = hi.score+'%';
    document.getElementById(`${key}-high-name`).textContent = hi.name||'—';
  } else {
    document.getElementById(`${key}-high`).textContent = '—';
    document.getElementById(`${key}-high-name`).textContent = '–';
  }

  const t = trend(entries);
  const tEl = document.getElementById(`${key}-trend`);
  const tSub = document.getElementById(`${key}-trend-sub`);
  if (t===null) { tEl.textContent='—'; tEl.className='stat-box-val'; }
  else if (t>0) { tEl.textContent=`↑ +${t.toFixed(1)}`; tEl.className='stat-box-val trend-up'; tSub.textContent='improving'; }
  else if (t<0) { tEl.textContent=`↓ ${t.toFixed(1)}`; tEl.className='stat-box-val trend-down'; tSub.textContent='declining'; }
  else { tEl.textContent='→ flat'; tEl.className='stat-box-val trend-flat'; tSub.textContent='stable'; }

  // Gap pill
  const gEl = document.getElementById(`${key}-gap`);
  if (wa===null) { gEl.textContent='—'; gEl.className='gap-pill gap-neutral'; }
  else {
    const gap = Math.round((wa-target)*10)/10;
    if (gap>=0) { gEl.textContent=`+${gap}% above target`; gEl.className='gap-pill gap-positive'; }
    else { gEl.textContent=`${gap}% below target`; gEl.className='gap-pill gap-negative'; }
  }

  // Log
  const logEl = document.getElementById(`log-${key}`);
  if (!entries.length) {
    logEl.innerHTML = `<div class="empty-log"><div class="empty-icon">📋</div>No entries yet — add your first assessment above</div>`;
  } else {
    logEl.innerHTML = [...entries].reverse().map((e,ri) => {
      const i = entries.length-1-ri;
      const scoreColor = e.score>=target?sub.accent:'#ff8a80';
      const w = TYPE_WEIGHTS[e.type]||1;
      return `<div class="log-entry">
        <span class="entry-score" style="color:${scoreColor}">${e.score}%</span>
        <span class="entry-name">${e.name||'Untitled'}</span>
        <span class="entry-type">${e.type}</span>
        <span class="entry-weight" title="Weight multiplier">×${w}</span>
        <span class="entry-date">${e.date}</span>
        <button class="entry-del" onclick="deleteEntry('${key}',${i})" title="Delete">×</button>
      </div>`;
    }).join('');
  }

  // Update chart
  if (charts[key]) {
    const labels = entries.map((_,i)=>i===0?'Start':`#${i+1}`);
    charts[key].data.labels = labels.length ? labels : [''];
    charts[key].data.datasets[0].data = entries.map(e=>e.score);
    charts[key].data.datasets[1].data = (labels.length?labels:['—']).map(()=>target);
    charts[key].update('active');
  }

  refreshWeighted();
  refreshOverview();
}

function addEntry(key) {
  const nameEl  = document.getElementById(`in-name-${key}`);
  const scoreEl = document.getElementById(`in-score-${key}`);
  const typeEl  = document.getElementById(`in-type-${key}`);
  const score = parseFloat(scoreEl.value);
  if (isNaN(score)||score<0||score>100) {
    scoreEl.style.borderColor='rgba(255,138,128,0.6)';
    setTimeout(()=>scoreEl.style.borderColor='',1200);
    return;
  }
  const now = new Date();
  const date = now.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
  data[key].push({ name:nameEl.value.trim()||typeEl.value, score, type:typeEl.value, date });
  nameEl.value=''; scoreEl.value='';
  saveData();
  refreshSubject(key);
}

function deleteEntry(key, idx) {
  data[key].splice(idx,1);
  saveData();
  refreshSubject(key);
}

function setTarget(key, val) {
  targets[key] = parseFloat(val)||80;
  saveData();
  refreshSubject(key);
}

// ── Weighted grid ──
function refreshWeighted() {
  const grid = document.getElementById('weighted-grid');
  grid.innerHTML = SUBJECTS.map(s => {
    const wa = weightedAvg(data[s.key]||[]);
    const entries = (data[s.key]||[]).length;
    const target = targets[s.key]||80;
    const col = wa===null ? 'rgba(240,240,250,0.25)' : wa>=target ? s.accent : '#ff8a80';
    return `<div class="wg-cell">
      <div class="wg-dot" style="background:${s.accent};box-shadow:0 0 8px ${s.accent}55;"></div>
      <div class="wg-name">${s.short}</div>
      <div class="wg-score" style="color:${col}">${wa!==null?wa+'%':'—'}</div>
      <div class="wg-entries">${entries} entr${entries===1?'y':'ies'}</div>
    </div>`;
  }).join('');
}

// ── Overview ──
function refreshOverview() {
  const all = SUBJECTS.flatMap(s=>(data[s.key]||[]).map(e=>({...e,subject:s.key})));
  document.getElementById('ov-total').textContent = all.length;

  const avgs = SUBJECTS.map(s=>({s,wa:weightedAvg(data[s.key]||[])})).filter(x=>x.wa!==null);
  if (avgs.length) {
    const overall = Math.round(avgs.reduce((s,x)=>s+x.wa,0)/avgs.length*10)/10;
    document.getElementById('ov-avg').textContent = overall+'%';
    const best  = avgs.reduce((m,x)=>x.wa>m.wa?x:m);
    const worst = avgs.reduce((m,x)=>x.wa<m.wa?x:m);
    document.getElementById('ov-best').textContent=best.s.name;
    document.getElementById('ov-best').style.color=best.s.accent;
    document.getElementById('ov-best-sub').textContent=best.wa+'% avg';
    document.getElementById('ov-worst').textContent=worst.s.name;
    document.getElementById('ov-worst').style.color='#ff8a80';
    document.getElementById('ov-worst-sub').textContent=worst.wa+'% avg';
  } else {
    document.getElementById('ov-avg').textContent='—';
    document.getElementById('ov-best').textContent='—';
    document.getElementById('ov-best-sub').textContent='no data yet';
    document.getElementById('ov-worst').textContent='—';
    document.getElementById('ov-worst-sub').textContent='no data yet';
  }
}

// ── Keyboard shortcut: Enter to add ──
document.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    const scoreEl = document.getElementById(`in-score-${activeTab}`);
    if (document.activeElement===scoreEl || document.activeElement===document.getElementById(`in-name-${activeTab}`)) {
      addEntry(activeTab);
    }
  }
});

// ── Init ──
loadData();
buildTabs();
buildPanels();
SUBJECTS.forEach(s => refreshSubject(s.key));
initChart(activeTab);

// Chart on switch
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const key = btn.id.replace('tab-','');
    if (!charts[key]) initChart(key);
  });
});
</script>
</body>
</html>
